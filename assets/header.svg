<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Chetan Panchal, cloud engineer ii at amazon web services, toronto">
  <defs>
    <clipPath id="card"><rect width="1200" height="320" rx="28"/></clipPath>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="70"/></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.33" stop-color="#f472b6"/>
      <stop offset="0.66" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animate attributeName="x1" values="0;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0a0e1a"/>
    <g filter="url(#blur)">
      <circle cx="170" cy="110" r="190" fill="#8b5cf6" fill-opacity="0.55">
        <animate attributeName="cx" values="170;280;170" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="110;210;110" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="680" cy="330" r="210" fill="#ec4899" fill-opacity="0.42">
        <animate attributeName="cx" values="680;560;680" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="330;250;330" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1060" cy="70" r="200" fill="#22d3ee" fill-opacity="0.42">
        <animate attributeName="cx" values="1060;940;1060" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="70;170;70" dur="11s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect width="1200" height="320" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- status pill -->
  <g>
    <rect x="1004" y="28" width="168" height="34" rx="17" fill="#0f1629" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="1026" cy="45" r="5" fill="#34d399">
      <animate attributeName="fill-opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1026" cy="45" r="5" fill="none" stroke="#34d399" stroke-opacity="0.6">
      <animate attributeName="r" values="5;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1040" y="50" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e2e8f0">open to chat</text>
  </g>

  <!-- version tag -->
  <text x="32" y="50" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#64748b">~/chetan · v2026.10</text>

  <!-- copy -->
  <text x="600" y="118" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#c7d2fe">hey, i'm</text>
  <text x="600" y="196" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="-3" fill="url(#name)">Chetan Panchal</text>
  <text x="600" y="240" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#e2e8f0">cloud engineer ii @ amazon web services · toronto</text>
  <text x="600" y="276" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#94a3b8">opensearch · kafka · terraform · kubernetes · genai</text>

  <rect x="400" y="300" width="400" height="2" fill="url(#line)"/>
</svg>
